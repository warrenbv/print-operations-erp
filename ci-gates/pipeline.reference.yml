# REFERENCE ONLY. NOT EXECUTED IN THIS REPOSITORY.
#
# This is the GitLab CI definition from the original project, with its comments
# removed and rewritten and its test credentials replaced. It shows how the
# gates in this folder ran. In the project the scripts lived under scripts/ci/,
# which is the path used below. Here they live in ci-gates/. The GitHub
# workflow in this repository runs their tests, not the gates themselves.
#
# How the gates were wired:
#   docs-integrity    its own job on every merge request and on main
#   governance-guard  its own job on every merge request; exit 3 is allowed to
#                     fail, which shows as a warning instead of a red pipeline
#   docs-only         first line of the heavy jobs' setup; a documentation-only
#                     change ends those jobs early as a success
#   docs-freshness    not wired into the pipeline; it was a report run by hand

default:
  image: node:22
  # Every job only reads and verifies, so a superseded run is safe to cancel.
  interruptible: true
  # Retry only failures of the machine, never script failures, so a flaky test
  # still shows as a failure.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - runner_unsupported
      - scheduler_failure
      - data_integrity_failure
      - unmet_prerequisites
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

# `needs` decides the order. Most jobs start with the pipeline.
stages:
  - verify
  - build
  - e2e
  - publish

variables:
  PNPM_STORE_DIR: '$CI_PROJECT_DIR/.pnpm-store'

.node-setup: &node-setup
  before_script:
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

# The same setup, but a documentation-only merge request ends the job first.
# `exit 0` ends the whole job because before_script and script share a shell.
# Full history is needed to diff against the merge-request base.
.node-setup-unless-docs-only: &node-setup-unless-docs-only
  variables:
    GIT_DEPTH: '0'
  before_script:
    - node scripts/ci/docs-only.mjs && exit 0
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir "$PNPM_STORE_DIR"
    - pnpm install --frozen-lockfile

lint:
  stage: verify
  needs: []
  <<: *node-setup
  variables:
    GIT_DEPTH: '0'
  script:
    - pnpm lint
    - pnpm format:check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

commitlint:
  stage: verify
  needs: []
  <<: *node-setup
  variables:
    GIT_DEPTH: '0'
  script:
    - pnpm exec commitlint --from="$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to=HEAD
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

typecheck:
  stage: verify
  needs: []
  <<: *node-setup-unless-docs-only
  script:
    - pnpm typecheck
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

test:
  stage: verify
  needs: []
  <<: *node-setup-unless-docs-only
  services:
    - postgres:18
  # This block replaces the anchor's variables, so GIT_DEPTH is restated.
  variables:
    GIT_DEPTH: '0'
    POSTGRES_DB: app_test
    POSTGRES_USER: app
    POSTGRES_PASSWORD: test_only_password
    DATABASE_URL: 'postgresql://app:test_only_password@postgres:5432/app_test'
  # One test job at a time across the project, so database suites do not
  # share a runner host and time out.
  resource_group: test
  script:
    - pnpm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Dependency-free Node, so no install and no cache.
docs-integrity:
  stage: verify
  needs: []
  before_script: []
  cache: []
  script:
    - node scripts/ci/docs-integrity.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Dependency-free Node. Full history, because it diffs against the base.
governance-guard:
  stage: verify
  needs: []
  variables:
    GIT_DEPTH: '0'
  before_script: []
  cache: []
  # Exit 3 is the warning verdict: shown at the merge button, never blocking.
  # Exit 1 stays a hard failure.
  allow_failure:
    exit_codes:
      - 3
  script:
    - node scripts/ci/governance-guard.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Browser tests against the apps built by `build`. The image version must
# match the Playwright library version.
e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  <<: *node-setup-unless-docs-only
  needs:
    - build
  # The browser tests use fixed ports, so only one e2e job runs at a time.
  resource_group: e2e
  script:
    - pnpm exec playwright test
  artifacts:
    when: on_failure
    paths:
      - test-results/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:
  stage: build
  needs: []
  <<: *node-setup-unless-docs-only
  script:
    - pnpm build
  artifacts:
    paths:
      - apps/api/dist/
      - apps/web/.next/
      - modules/*/dist/
      - packages/*/dist/
    exclude:
      - apps/web/.next/cache/**/*
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# Main branch only, after every other stage: builds and pushes the two images.
# Not interruptible, because a half-pushed tag is worse than a finished one.
publish-images:
  stage: publish
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: '1'
  before_script: []
  cache: []
  interruptible: false
  resource_group: publish
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - >
      docker build --pull -f apps/api/Dockerfile
      --cache-from "$CI_REGISTRY_IMAGE/erp-api:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t "$CI_REGISTRY_IMAGE/erp-api:$CI_COMMIT_SHORT_SHA"
      -t "$CI_REGISTRY_IMAGE/erp-api:latest" .
    - >
      docker build --pull -f apps/web/Dockerfile
      --cache-from "$CI_REGISTRY_IMAGE/erp-web:latest"
      --build-arg BUILDKIT_INLINE_CACHE=1
      -t "$CI_REGISTRY_IMAGE/erp-web:$CI_COMMIT_SHORT_SHA"
      -t "$CI_REGISTRY_IMAGE/erp-web:latest" .
    - docker push --all-tags "$CI_REGISTRY_IMAGE/erp-api"
    - docker push --all-tags "$CI_REGISTRY_IMAGE/erp-web"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
